# .pages.yml
site:
  - name: "A Cara do Pedro"
    description: "Soluções técnicas com propósito - Tecnologia, mão de obra e projeto social"
    url: "https://seuusuario.github.io"  # Troque pelo seu URL do GitHub Pages

collections:
  - name: "paginas"
    label: "Páginas do Site"
    files:
      - name: "historia"
        label: "Minha História"
        file: "index.html"
        fields:
          - name: "titulo_historia"
            label: "Título da História"
            type: "string"
            default: "Raízes Fortes, História Viva"
            selector: "#historia .historia-titulo"
          
          - name: "texto_historia"
            label: "Texto da História"
            type: "text"
            default: "Sou fruto do encontro de brasis. Nascido em Itaquaquecetuba, carrego em meu DNA a força do Nordeste e a energia de São Paulo..."
            selector: "#historia .historia-texto"
          
          - name: "foto_perfil"
            label: "Foto de Perfil"
            type: "image"
            default: "/imagens/minhafoto.png"
            selector: "#historia img"
      
      - name: "servicos"
        label: "Lista de Serviços"
        file: "index.html"
        fields:
          - name: "tecnologia"
            label: "Serviços de Tecnologia"
            type: "text"
            selector: "#servicos ul li"
      
      - name: "contato"
        label: "Informações de Contato"
        file: "index.html"
        fields:
          - name: "whatsapp"
            label: "Link do WhatsApp"
            type: "string"
            selector: "#contato a[href*='wa.me']"
          
          - name: "email"
            label: "Email"
            type: "string"
            selector: "#contato a[href*='mailto']"

  - name: "posts"
    label: "Atualizações"
    folder: "posts"
    create: true
    fields:
      - name: "titulo"
        label: "Título"
        type: "string"
        required: true
      
      - name: "data"
        label: "Data"
        type: "date"
        default: "{{now}}"
      
      - name: "imagem"
        label: "Imagem de Destaque"
        type: "image"
      
      - name: "conteudo"
        label: "Conteúdo"
        type: "text"
        required: true

media:
  - name: "imagens"
    label: "Imagens"
    folder: "imagens"
    create: true
    accept:
      - "image/png"
      - "image/jpeg"
      - "image/jpg"
      - "image/gif"
