<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Cara do Pedro | Orçamento Instantâneo</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0a0a0a;
    color:white;
}
header {
    text-align:center;
    padding:2rem;
    border-bottom:2px solid #00e676;
}
h1 { color:#00e676; }

section {
    padding:2rem;
    max-width:900px;
    margin:auto;
}
.card {
    background:#111;
    padding:1rem;
    margin:1rem 0;
    border-radius:10px;
}
.botao {
    display:inline-block;
    background:#00e676;
    color:black;
    padding:1rem;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    margin-top:1rem;
}
input, select {
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
    border:none;
}
</style>
</head>

<body>

<header>
<h1>A Cara do Pedro</h1>
<p>Orçamento rápido. Sem enrolação.</p>
</header>

<section>
<h2>💰 Orçamento Automático</h2>

<label>Qual serviço você precisa?</label>
<select id="servico">
<option value="">Selecione</option>
<option value="formatacao">Formatação de PC</option>
<option value="virus">Remoção de vírus</option>
<option value="rede">Configurar Wi-Fi</option>
<option value="pintura">Pintura</option>
<option value="limpeza">Limpeza de terreno</option>
<option value="montagem">Montagem de móveis</option>
<option value="obra">Ajudante de obra</option>
<option value="site">Criação de site</option>
<option value="suporte">Suporte técnico geral</option>
</select>

<label>Descreva o que você precisa</label>
<input type="text" id="descricao" placeholder="Ex: computador lento, parede descascando...">

<button class="botao" onclick="gerarOrcamento()">Gerar orçamento</button>

<div id="resultado" class="card"></div>

<a id="whatsappBtn" class="botao" target="_blank" style="display:none;">Enviar no WhatsApp</a>

</section>

<script>

function analisarTexto(texto){
    texto = texto.toLowerCase();

    if(texto.includes("lento") || texto.includes("travando")) return "formatacao";
    if(texto.includes("virus")) return "virus";
    if(texto.includes("internet") || texto.includes("wifi")) return "rede";
    if(texto.includes("parede") || texto.includes("pintar")) return "pintura";
    if(texto.includes("sujo") || texto.includes("mato")) return "limpeza";
    if(texto.includes("móvel")) return "montagem";

    return null;
}

function gerarOrcamento(){

    let servico = document.getElementById("servico").value;
    let desc = document.getElementById("descricao").value;

    let detectado = analisarTexto(desc);
    if(!servico && detectado) servico = detectado;

    let preco = "";

    switch(servico){
        case "formatacao":
            preco = "R$80 a R$150";
            break;
        case "virus":
            preco = "R$70 a R$120";
            break;
        case "rede":
            preco = "R$80 a R$200";
            break;
        case "pintura":
            preco = "R$150+";
            break;
        case "limpeza":
            preco = "R$100+";
            break;
        case "montagem":
            preco = "R$80+";
            break;
        case "obra":
            preco = "Diária R$120";
            break;
        case "site":
            preco = "R$200 a R$600";
            break;
        case "suporte":
            preco = "R$50 a R$100";
            break;
        default:
            preco = "Sob avaliação";
    }

    let resultado = `
    Serviço: ${servico || "Não identificado"}<br>
    Estimativa: ${preco}<br>
    Descrição: ${desc}
    `;

    document.getElementById("resultado").innerHTML = resultado;

    let msg = encodeURIComponent(
        `Olá Pedro, quero esse serviço:\n\n${resultado}`
    );

    let link = "https://wa.me/5511977487454?text=" + msg;

    let btn = document.getElementById("whatsappBtn");
    btn.href = link;
    btn.style.display = "inline-block";
}

</script>

</body>
</html>
