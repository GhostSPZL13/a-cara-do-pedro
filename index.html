<!-- ===== Chat Bot ===== -->
<div id="chatbot">
    <div id="bot-messages"></div>
    <input id="bot-input" type="text" placeholder="Fala comigo...">
</div>

<style>
/* ===== Estilo do Chat Bot ===== */
#chatbot {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 300px;
    height: 400px;
    background: #111;
    color: white;
    padding: 10px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 15px rgba(0,255,136,0.3);
    font-family: Arial, sans-serif;
    z-index: 1000;
}

#bot-messages {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 10px;
    padding-right: 5px;
}

#bot-input {
    width: 100%;
    padding: 8px;
    border: 1px solid #00ff88;
    border-radius: 6px;
    background: #1a1a1a;
    color: white;
}

.bot-msg {
    background: #00ff88;
    color: #000;
    padding: 6px 10px;
    border-radius: 8px;
    margin-bottom: 5px;
    max-width: 80%;
}

.user-msg {
    background: #333;
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    margin-bottom: 5px;
    align-self: flex-end;
    max-width: 80%;
}
</style>

<script>
// ===== JS do Chat Bot =====
const botMessages = document.getElementById("bot-messages");
const botInput = document.getElementById("bot-input");

// Respostas automáticas simples
const respostas = {
    "oi": "E aí! Como posso te ajudar hoje?",
    "olá": "Oi! Tudo certo?",
    "serviço": "Eu ofereço manutenção, Windows, Linux, criação de sites e mais!",
    "projeto": "Tenho o projeto social Lar Sem Fronteiras, quer conhecer?",
    "default": "Hmm, não entendi bem. Pode tentar outra coisa?"
};

botInput.addEventListener("keypress", function(e){
    if(e.key === "Enter" && botInput.value.trim() !== "") {
        const userMsg = botInput.value;
        addMessage(userMsg, "user");
        botInput.value = "";
        setTimeout(() => {
            const resposta = respostas[userMsg.toLowerCase()] || respostas["default"];
            addMessage(resposta, "bot");
        }, 500);
    }
});

function addMessage(msg, tipo){
    const div = document.createElement("div");
    div.textContent = msg;
    div.className = tipo === "bot" ? "bot-msg" : "user-msg";
    botMessages.appendChild(div);
    botMessages.scrollTop = botMessages.scrollHeight;
}
</script>
